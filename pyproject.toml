[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-booking-intelligence"
version = "0.1.0"
description = "Reproducible City Hotel pricing, cancellation, and segmentation experiments"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
ml = [
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "scipy>=1.15,<2",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.10,<4",
    "seaborn>=0.13,<1",
    "joblib>=1.4,<2",
]
dev = ["ruff>=0.9,<1"]
notebooks = ["ipykernel>=6.29,<8"]

[project.scripts]
hotel-ml = "hotel_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
